[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fstec-monitor"
version = "0.6.0"
description = "Versioned monitor for FSTEC document pages, HTML text, PDF and ODT attachments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Basil-AS"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "aiogram @ git+https://github.com/aiogram/aiogram.git@0a8fb78f4ab71c917b58d3a671b54e2cfb7dba4c",
  "pydantic>=2.5",
  "lxml>=5.2",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "rich>=13.7",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
fstec-monitor = "fstec_monitor.cli:app"
fstec-monitor-bot = "fstec_monitor.telegram_bot:run_bot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
